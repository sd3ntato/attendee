services:
  attendee-worker-local:
    build: ./
    volumes:
      - .:/attendee
      - /home/ec2-user/.kube:/home/app/.kube:ro
      - ./docker-entrypoint-k8s.sh:/docker-entrypoint-k8s.sh:ro
    networks:
      - attendee_network
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379/5
      - DJANGO_SETTINGS_MODULE=attendee.settings.development
      - ENABLE_CHROME_SANDBOX=false
      - LAUNCH_BOT_METHOD=kubernetes
      - CUBER_APP_NAME=attendee
      - CUBER_RELEASE_VERSION=v1.0.2
      - BOT_POD_IMAGE=248127682412.dkr.ecr.eu-north-1.amazonaws.com/meeting-assistant/attendee
      - BOT_POD_NAMESPACE=attendee-bots
      - BOT_POD_SERVICE_ACCOUNT_NAME=attendee-sa
      - BOT_POD_CONFIG_MAP_NAME=attendee-config
      - BOT_POD_SECRETS_NAME=attendee-secrets
      - DISABLE_BOT_POD_IMAGE_PULL_SECRET=true
      - BOT_CPU_REQUEST=700m
      - BOT_MEMORY_REQUEST=1500Mi
      - BOT_MEMORY_LIMIT=2Gi
    command: "celery -A attendee worker -l INFO --max-tasks-per-child=2"
    entrypoint: ["/docker-entrypoint-k8s.sh"]
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "1.0"
          memory: 512M
    restart: unless-stopped

  attendee-scheduler-local:
    build: ./
    volumes:
      - .:/attendee
    networks:
      - attendee_network
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379/5
      - DJANGO_SETTINGS_MODULE=attendee.settings.development
    command: "python manage.py run_scheduler"
    entrypoint: []
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    restart: unless-stopped

  attendee-app-local:
    build: ./
    volumes:
      - .:/attendee
      - /home/ec2-user/.kube:/home/app/.kube:ro
      - ./docker-entrypoint-k8s.sh:/docker-entrypoint-k8s.sh:ro
    networks:
      - attendee_network
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_HOST=postgres
      - REDIS_URL=redis://redis:6379/5
      - DJANGO_SETTINGS_MODULE=attendee.settings.development
      - LAUNCH_BOT_METHOD=kubernetes
      - CUBER_APP_NAME=attendee
      - CUBER_RELEASE_VERSION=v1.0.2
      - BOT_POD_IMAGE=248127682412.dkr.ecr.eu-north-1.amazonaws.com/meeting-assistant/attendee
      - BOT_POD_NAMESPACE=attendee-bots
      - BOT_POD_SERVICE_ACCOUNT_NAME=attendee-sa
      - BOT_POD_CONFIG_MAP_NAME=attendee-config
      - BOT_POD_SECRETS_NAME=attendee-secrets
      - DISABLE_BOT_POD_IMAGE_PULL_SECRET=true
      - BOT_CPU_REQUEST=700m
      - BOT_MEMORY_REQUEST=1500Mi
      - BOT_MEMORY_LIMIT=2Gi
    command: python manage.py runserver 0.0.0.0:8000
    entrypoint: ["/docker-entrypoint-k8s.sh"]
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    restart: unless-stopped

  attendee-webpage-streamer-local:
    build: ./
    volumes:
      - .:/attendee
    networks:
      - attendee_network
    ports:
      - "8001:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=attendee.settings.development
      - ENABLE_CHROME_SANDBOX=true
    command: "python bots/webpage_streamer/run_webpage_streamer.py"
    security_opt:
      - seccomp=./bots/web_bot_adapter/chrome_seccomp.json
    profiles:
      - webpage-streamer
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
    restart: unless-stoped

  postgres:
    image: postgres:15.3-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: attendee_development
      POSTGRES_USER: attendee_development_user
      POSTGRES_PASSWORD: attendee_development_user
      PGDATA: /data/postgres
    volumes:
      - postgres:/data/postgres
    networks:
      - attendee_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - attendee_network
    restart: unless-stopped
    volumes:
      - redis:/data/redis
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M

networks:
  attendee_network:
    driver: bridge

volumes:
  postgres:
  redis:
